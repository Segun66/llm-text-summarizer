name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Lint, tests and build check (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: dev
      LOG_LEVEL: WARNING
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Build check
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip check
          python -c "from main import app; assert app.title == 'LLM Text Summarizer'"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q
